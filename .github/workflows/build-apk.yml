name: Build & Release Jarvis AI Debug APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional custom release tag (leave blank for automatic tag)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release-apk:
    name: Build Debug APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Android Gradle project
        id: locate
        run: |
          set -euo pipefail
          if [ -f "android/build.gradle.kts" ] || [ -f "android/build.gradle" ] || [ -f "android/settings.gradle.kts" ] || [ -f "android/settings.gradle" ]; then
            echo "project_dir=android" >> "$GITHUB_OUTPUT"
          elif [ -f "build.gradle.kts" ] || [ -f "build.gradle" ] || [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            echo "project_dir=." >> "$GITHUB_OUTPUT"
          else
            echo "::error::No Android Gradle project found at repository root or ./android."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Confirm Java 17, Gradle 9.3.1, and AGP 9.1.1
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail
          echo "--- Java Version ---"
          java -version

          echo "--- Gradle Version ---"
          gradle --version

          echo "--- Confirming AGP 9.1.1 ---"
          AGP_CONFIRMED=false
          for file in \
            "$PROJECT_DIR/gradle/libs.versions.toml" \
            "$PROJECT_DIR/build.gradle.kts" \
            "$PROJECT_DIR/build.gradle" \
            "$PROJECT_DIR/app/build.gradle.kts" \
            "$PROJECT_DIR/app/build.gradle"; do
            if [ -f "$file" ] && grep -Eq '9\.1\.1' "$file"; then
              echo "Confirmed AGP 9.1.1 reference in $file"
              AGP_CONFIRMED=true
            fi
          done

          if [ "$AGP_CONFIRMED" != "true" ]; then
            echo "::error::Could not confirm Android Gradle Plugin version 9.1.1 in Gradle configuration files."
            exit 1
          fi

          if [ -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "--- Wrapper Properties ---"
            cat "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"
          fi

      - name: Generate temporary debug keystore
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          rm -f "$HOME/.android/debug.keystore"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          # Also mirror into project app/ if referenced locally by debug signingConfig
          if [ -d "$PROJECT_DIR/app" ] && [ ! -f "$PROJECT_DIR/app/debug.keystore" ]; then
            cp "$HOME/.android/debug.keystore" "$PROJECT_DIR/app/debug.keystore"
          fi

      - name: Build Debug APK
        id: build_apk
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.properties" ] && grep -q "9\.3\.1" gradle/wrapper/gradle-wrapper.properties; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

          APK_FOUND="$(find . -path '*/build/outputs/apk/debug/*.apk' -type f | head -n 1 || true)"
          if [ -z "$APK_FOUND" ]; then
            echo "::error::Debug APK build completed, but no .apk file was found under build/outputs/apk/debug/."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release-artifacts"
          TARGET_APK="$GITHUB_WORKSPACE/release-artifacts/jarvis-ai-debug.apk"
          cp "$APK_FOUND" "$TARGET_APK"

          echo "apk_path=$TARGET_APK" >> "$GITHUB_OUTPUT"
          echo "apk_name=$(basename "$TARGET_APK")" >> "$GITHUB_OUTPUT"
          ls -lh "$TARGET_APK"

      # Upload artifact BEFORE release publishing so the APK is preserved if gh release fails
      - name: Upload Debug APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-ai-debug-apk-${{ github.run_number }}
          path: ${{ steps.build_apk.outputs.apk_path }}
          retention-days: 30
          if-no-files-found: error

      - name: Publish Debug APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.build_apk.outputs.apk_path }}
          INPUT_TAG: ${{ inputs.release_tag || '' }}
        run: |
          set -euo pipefail

          SHORT_SHA="${GITHUB_SHA::7}"
          if [ -n "$INPUT_TAG" ]; then
            RELEASE_TAG="$INPUT_TAG"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            RELEASE_TAG="debug-r${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          fi

          PRERELEASE_FLAG="--prerelease"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]] && [[ "${RELEASE_TAG}" != *-* ]]; then
            PRERELEASE_FLAG=""
          fi

          RELEASE_NOTES="$(printf 'Automated Jarvis AI debug APK build.\n\n- **Commit**: `%s`\n- **Workflow Run**: #%s\n- **Toolchain**: Java 17 · Gradle 9.3.1 · AGP 9.1.1\n' "${GITHUB_SHA}" "${GITHUB_RUN_NUMBER}")"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; uploading APK with --clobber..."
            gh release upload "$RELEASE_TAG" "$APK_PATH" --clobber
          else
            echo "Creating GitHub Release $RELEASE_TAG..."
            gh release create "$RELEASE_TAG" "$APK_PATH" \
              --title "Jarvis AI ($RELEASE_TAG)" \
              --notes "$RELEASE_NOTES" \
              $PRERELEASE_FLAG
          fi
